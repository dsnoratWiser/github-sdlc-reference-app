name: Maintenance
description: Track repository, tooling, dependency, or engineering maintenance work.
title: "[Maintenance]: "
labels:
  - "type:maintenance"

body:
  - type: markdown
    attributes:
      value: |
        Use this form for maintenance work that improves repository health,
        tooling, dependencies, documentation, or developer experience.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What maintenance outcome is needed?
      placeholder: Describe the maintenance goal.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this work needed now?
      placeholder: Describe the problem, risk, inefficiency, or maintenance need.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Repository
        - Build tooling
        - Dependencies
        - CI/CD
        - Documentation
        - Developer experience
        - Security
        - Other
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What work should be included?
      placeholder: Describe the work that belongs in this issue.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define observable conditions that must be true before this issue is complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Validation completed
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Identify related work that should not be included.
      placeholder: Describe exclusions, or write "None."
    validations:
      required: false
